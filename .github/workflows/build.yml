name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -storepass android -alias key0 -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Scientific Calculator, OU=Dev, O=Sikorokoro44, L=NA, ST=NA, C=US"
      - name: Sign APK with apksigner
        run: |
          SDK=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          $ANDROID_SDK_ROOT/build-tools/$SDK/apksigner sign --ks release.keystore --ks-key-alias key0 --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/*.apk
          $ANDROID_SDK_ROOT/build-tools/$SDK/apksigner verify --verbose app/build/outputs/apk/release/app-release-signed.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-signed.apk
