name: Publish Signed APK

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk
          run-id: 42090609338
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artifact contents
        run: |
          ls -la apk
          test -f apk/app-release-signed.apk
      - name: Upload to public release
        run: |
          UPLOAD_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.0.0" \
            | jq -r '.upload_url' | sed 's/{?name,label}//')
          echo "Upload URL: $UPLOAD_URL"
          curl -sL -X POST "$UPLOAD_URL&name=scientific-calculator.apk" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @apk/app-release-signed.apk | jq -r '.browser_download_url'
      - name: Verify public download
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v1.0.0/scientific-calculator.apk"
          echo "URL=$URL"
          curl -sI "$URL" | grep -iE 'HTTP/|content-type|content-disposition|content-length'
          curl -sL "$URL" -o downloaded.apk
          ls -l downloaded.apk
          sha256sum downloaded.apk
