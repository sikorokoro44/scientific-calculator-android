name: Publish APK

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/13412506404/zip \
            -o artifact.zip
          unzip -o artifact.zip -d artifact
          ls -la artifact
      - name: Verify SHA256
        run: |
          cd artifact
          echo "07c832d5245afd29b09aa40fe4517ddcf6a4dc2610b8fdab71b91f34b4c99681  app-release-unsigned.apk" | sha256sum -c -
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 artifact/app-release-unsigned.apk#app-release.apk --clobber --repo ${{ github.repository }}
      - name: Verify public download
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v1.0.0/app-release.apk"
          echo "URL=$URL"
          curl -sI "$URL" | grep -iE 'HTTP/|content-type|content-disposition|content-length'
          curl -sL "$URL" -o downloaded.apk
          ls -l downloaded.apk
          sha256sum downloaded.apk
