name: Publish Signed APK

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk
          run-id: 42090609338
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artifact contents
        run: |
          ls -la apk
          test -f apk/app-release-signed.apk
      - name: Verify signature
        run: |
          SDK=$(ls $ANDROID_SDK_BASE/build-tools | sort -V | tail -1)
          $ANDROID_SDK_BASE/build-tools/$SDK/apksigner verify --verbose apk/app-release-signed.apk
      - name: Verify package ID
        run: |
          SDK=$(ls $ANDROID_SDK_BASE/build-tools | sort -V | tail -1)
          $ANDROID_SDK_BASE/build-tools/$SDK/aapt dump badging apk/app-release-signed.apk | grep "package: name='com.sikorokoro44.scientificcalculator'"
      - name: Upload to public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 apk/app-release-signed.apk#scientific-calculator.apk --clobber --repo ${{ github.repository }}
      - name: Verify public download
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v1.0.0/scientific-calculator.apk"
          echo "URL=$URL"
          curl -sI "$URL" | grep -iE 'HTTP/|content-type|content-disposition|content-length'
          curl -sL "$URL" -o downloaded.apk
          ls -l downloaded.apk
          sha256sum downloaded.apk
